[supervisord]
nodaemon=true
logfile=/home/container/logs/supervisord.log
pidfile=/home/container/run/supervisord.pid
user=container

[unix_http_server]
file=/home/container/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///home/container/run/supervisor.sock

[program:php-fpm]
command=/usr/sbin/php-fpm --nodaemonize --fpm-config /etc/php/8.3/fpm/php-fpm.conf
autostart=true
autorestart=true
stdout_logfile=/home/container/logs/php-fpm.log
stderr_logfile=/home/container/logs/php-fpm.err.log

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;" -c /etc/nginx/nginx.conf
autostart=true
autorestart=true
stdout_logfile=/home/container/logs/nginx.log
stderr_logfile=/home/container/logs/nginx.err.log
