[www]
; Container udah jalan sebagai user non-root ("container"), jadi php-fpm
; TIDAK perlu (dan tidak bisa) setuid ke user lain lagi.
user  = container
group = container

listen = /home/container/run/php-fpm.sock
listen.owner = container
listen.group = container
listen.mode  = 0660

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

php_admin_value[error_log] = /home/container/logs/php-fpm-error.log
php_admin_flag[log_errors] = on

clear_env = no
catch_workers_output = yes
